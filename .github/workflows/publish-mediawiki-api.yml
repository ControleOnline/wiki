name: Publish MediaWiki pages by API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Publish pages through MediaWiki API
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MEDIAWIKI_API_URL: https://ajuda.controleonline.com/api.php
          MEDIAWIKI_CREDENTIALS_FTP_PATH: ../.controleonline/mediawiki.env
        run: bash scripts/publish_mediawiki_api.sh
