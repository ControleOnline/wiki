name: Store MediaWiki credentials on FTP

on:
  workflow_dispatch:
    inputs:
      credential_path:
        description: "FTP path outside public_html"
        required: false
        default: "../.controleonline/mediawiki.env"

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Store private MediaWiki credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MEDIAWIKI_API_URL: https://ajuda.controleonline.com/api.php
          MEDIAWIKI_USERNAME: ${{ secrets.MEDIAWIKI_USERNAME }}
          MEDIAWIKI_PASSWORD: ${{ secrets.MEDIAWIKI_PASSWORD }}
          MEDIAWIKI_CREDENTIALS_FTP_PATH: ${{ inputs.credential_path }}
        run: bash scripts/store_mediawiki_credentials_on_ftp.sh
